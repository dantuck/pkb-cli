name: pr-title

# Squash-merging makes the PR title the commit message release-please reads,
# so it has to be a valid Conventional Commit (feat:, fix:, feat!:, ...).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ github.token }}
