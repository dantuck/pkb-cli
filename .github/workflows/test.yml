name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
  test:
    # pinned: ubuntu-latest (26.04) has no Python 3.9 build for setup-python
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check pkb_cli/templates/web/app.js
      - run: node --check pkb_cli/templates/worker/public/app.js
      - run: node --check pkb_cli/templates/worker/public/sw.js
      - name: Type-check the Worker
        working-directory: pkb_cli/templates/worker
        run: pnpm install --no-frozen-lockfile && pnpm check
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from a built wheel and smoke-test the entry point
        run: |
          pip install build
          python -m build --wheel
          pip install dist/*.whl
          cd "$(mktemp -d)"
          kb --version
          kb help
          python -c "import importlib.resources as r; assert r.files('pkb_cli').joinpath('templates/schema.sql').is_file(); assert r.files('pkb_cli').joinpath('templates/web/vendor/alpine.min.js').is_file()"
