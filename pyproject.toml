[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pkb-cli"
version = "0.1.0"
description = "kb: CLI for a Diataxis-based personal knowledge base"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["knowledge-base", "notes", "diataxis", "cli", "markdown"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Homepage = "https://github.com/dantuck/pkb-cli"
Issues = "https://github.com/dantuck/pkb-cli/issues"

[project.scripts]
kb = "pkb_cli.cli:main"

[tool.setuptools]
packages = ["pkb_cli"]

[tool.setuptools.package-data]
pkb_cli = ["templates/*", "templates/web/*", "templates/web/vendor/*", "skills/kb/*"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# pyflakes + pycodestyle errors; style-only rules (E501, E70x) are left to taste
select = ["F", "E"]
ignore = ["E501", "E701", "E702", "E731", "E741"]
