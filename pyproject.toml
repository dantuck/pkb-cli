[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pkb-cli"
version = "0.7.0"
description = "kb: CLI for a Diataxis-based personal knowledge base"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["knowledge-base", "notes", "diataxis", "cli", "markdown"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Text Processing :: Markup :: Markdown",
]

[project.optional-dependencies]
# meaning-based search: a small static embedding model run in-process (no server,
# no network at search time). model2vec needs Python >= 3.10.
semantic = ["model2vec>=0.5; python_version >= '3.10'"]

[project.urls]
Homepage = "https://github.com/dantuck/pkb-cli"
Issues = "https://github.com/dantuck/pkb-cli/issues"

[project.scripts]
kb = "pkb_cli.cli:main"

[tool.setuptools]
packages = ["pkb_cli"]

[tool.setuptools.package-data]
pkb_cli = ["templates/**/*", "skills/**/*"]

# a dev checkout may have installed or generated these in the Worker's directory
[tool.setuptools.exclude-package-data]
pkb_cli = ["templates/worker/node_modules/*", "templates/worker/.wrangler/*",
           "templates/worker/pnpm-lock.yaml", "templates/worker/worker-configuration.d.ts"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# pyflakes + pycodestyle errors; style-only rules (E501, E70x) are left to taste
select = ["F", "E"]
ignore = ["E501", "E701", "E702", "E731", "E741"]
